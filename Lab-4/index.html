<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4</title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>
    <form method="GET" action="https://httpbin.org/get">
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="user_name"> 
        <br>
        <label>Дата народження:
        <input type="date" name="user_birthdate">
        </label>
        <br>
        <label for="email">Імейл:</label>
        <input type="email" id="email" name="user_email">
        <br>
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="user_message"></textarea>
        <br>
      <p>Ваші улюблені напої:</p>
      <label><input type="checkbox" name="drinks" value="coffee">Кава</label>
      <br>
      <label><input type="checkbox" name="drinks" value="tea">Чай</label>
      <br>
      <label><input type="checkbox" name="drinks" value="juice">Сік</label>
      <br>
      <label><input type="checkbox" name="drinks" value="water">Вода</label>
      <br>

      <p>Моя національність:</p>
      <label><input type="radio" name="nationality" value="ukrainian">Українець</label>
      <br>
      <label><input type="radio" name="nationality" value="slovak">Словак</label>
      <br>
      <label><input type="radio" name="nationality" value="another">Інше</label>
      <br>
      
      <button type="submit">Надіслати</button>
      <button type="reset">Очистити</button>
      
    </form>
    <picture>
      <source media="(max-width:468px)" srcset="https://picsum.photos/id/237/300/500">
      <img src="https://picsum.photos/id/238/1000/400" alt="random image">
    </picture>
    <br>
    
  
  </body>
</html>
